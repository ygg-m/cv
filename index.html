<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ygor Goulart - QA Tester</title>
    <!-- Blocking on purpose: sets the Theme before first paint (no flash). Keep in sync with
         resolveTheme() in src/theme.ts; tests/unit/theme.spec.ts checks they agree. -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("theme");
        } catch (e) {}
        var light = window.matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.dataset.theme =
          stored === "dark" || stored === "light" ? stored : light ? "light" : "dark";
      })();
    </script>
  </head>
  <body>
    <header>
      <button id="theme-toggle" class="toggle" type="button" aria-label="Switch to light theme">
        Light
      </button>
      <button id="locale-toggle" class="toggle" type="button" aria-label="Switch language to Portuguese">
        <span lang="pt-BR">Português</span>
      </button>
    </header>
    <main>
      <h1>Ygor Goulart</h1>
      <p id="headline" data-i18n="profile.headline.title">QA Tester</p>
      <p id="subtitle" data-i18n="profile.headline.subtitle">Test Automation</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
