<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ygor Goulart - QA Tester</title>
    <!-- Blocking on purpose: sets the Theme before first paint (no flash). Keep in sync with
         resolveTheme() in src/theme.ts; tests/unit/theme.spec.ts checks they agree. -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("theme");
        } catch (e) {}
        var light = window.matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.dataset.theme =
          stored === "dark" || stored === "light" ? stored : light ? "light" : "dark";
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="ui.skipToContent">Skip to content</a>
    <header class="site-header">
      <nav aria-label="Sections" data-i18n-label="ui.navLabel">
        <a href="#about" data-i18n="ui.sections.about">About</a>
        <a href="#skills" data-i18n="ui.sections.skills">Skills</a>
        <a href="#experience" data-i18n="ui.sections.experience">Experience</a>
        <a href="#education" data-i18n="ui.sections.education">Education</a>
        <a href="#certifications" data-i18n="ui.sections.certifications">Certifications</a>
        <a href="#testing" data-i18n="ui.sections.testing">Testing</a>
        <a href="#contact" data-i18n="ui.sections.contact">Contact</a>
      </nav>
      <div class="toggles">
        <button id="theme-toggle" class="toggle" type="button" aria-label="Switch to light theme">
          Light
        </button>
        <button id="locale-toggle" class="toggle" type="button" aria-label="Switch language to Portuguese">
          <span lang="pt-BR">Português</span>
        </button>
      </div>
    </header>
    <div id="content" data-locale="en"><!--prerender--></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
