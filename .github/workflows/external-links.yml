name: External links

on:
  schedule:
    # Weekly, Monday 06:00 UTC — external sites are flaky, so this runs on a
    # schedule only and never blocks pull requests.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    name: Check outbound links on the live site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run links:external
