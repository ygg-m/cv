name: Nightly

# Slow, network-dependent checks kept out of the per-commit pipeline: Lighthouse budgets and a crawl of
# every link on the site. Scheduled runs only happen on the default branch; the push trigger lets edits to
# this file be verified on a feature branch.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/nightly.yml]

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:all
      - run: npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:all
      - run: npm run check:links
