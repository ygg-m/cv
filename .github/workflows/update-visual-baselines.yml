name: Update visual baselines

# Run when screenshots changed on purpose. Baselines are generated inside the same Playwright image CI
# compares in (ADR 0003), then committed back to the branch.
#
# GitHub only lists dispatchable workflows from the default branch, so on a feature branch trigger it by
# changing the marker file: `date > .github/visual-baselines.trigger`, commit, push.
on:
  workflow_dispatch:
  push:
    paths: [.github/visual-baselines.trigger]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      PLAYWRIGHT_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - run: npx playwright test --project=visual --update-snapshots
      - name: Commit changed baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
          else
            git commit -m "Update visual baselines"
            git push
          fi
